name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather -d weather_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://weather:weather@localhost:5432/weather_test
      TEST_DATABASE_URL: postgresql+psycopg://weather:weather@localhost:5432/weather_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check migrations match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    name: Docker image and Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env from the template
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: API is healthy and the schema was migrated
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          echo
          curl --fail --silent --show-error "http://localhost:8000/api/v1/weather?limit=1" \
            | tee /dev/stderr | grep -q '"total":0'

      - name: OpenWeather errors are mapped (placeholder key is rejected upstream)
        run: |
          status=$(curl --silent --output /dev/stderr --write-out '%{http_code}' \
            -X POST "http://localhost:8000/api/v1/weather/fetch?city=Florianopolis,BR")
          echo
          echo "HTTP $status"
          # 502 = key rejected by OpenWeather; 503 = OpenWeather unreachable from the runner.
          [ "$status" = "502" ] || [ "$status" = "503" ]

      - name: Container runs as a non-root user
        run: test "$(docker compose exec -T api id -u)" != "0"

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
